# Muralis Configuration File
# Part of Qutility Suite by Quoxiom

[general]
# Available providers: bing, nasa, unsplash, wallhaven
provider = bing

# Automatically update wallpaper
auto_update = true

# Update interval in seconds (86400 = 1 day)
update_interval = 86400

# Randomize provider selection
randomize = false

[storage]
# Save downloaded wallpapers
save_downloads = true

# Directory to store wallpapers
download_dir = ~/Pictures/Muralis

# Maximum number of files to keep (0 = unlimited)
max_files = 100

# Maximum age in days (0 = unlimited)
max_days = 30

# Keep favorited wallpapers forever
keep_favorites = false

[image]
# Desired resolution (1920x1080, 2560x1440, 3840x2160)
resolution = 3840x2160

# Apply image effects
apply_effects = false

# Effect type: none, blur, darken, grayscale, vibrant, vignette
effect_type = none

# JPEG quality (1-100)
jpeg_quality = 90

# Image fitting: zoom, fill, fit, stretch, center
fit_mode = zoom

[notifications]
# Show desktop notifications
enabled = true

# Show preview thumbnail in notification
show_preview = true

# Play sound on wallpaper change
sound = false

[advanced]
# Number of retry attempts for downloads
retry_attempts = 3

# Download timeout in seconds
timeout_seconds = 30

# Custom user agent string
user_agent = Muralis/0.1.0 (Qutility Suite)
