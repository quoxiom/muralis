[build-system]
requires = ["setuptools>=61.0", "wheel>=0.37.0"]
build-backend = "setuptools.build_meta"

[project]
name = "muralis"
dynamic = ["version"]
description = "Smart Wallpaper Manager for Linux Desktops"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Qamber Haidry", email = "qamber.haidry@quoxiom.com" }]
maintainers = [{ name = "Qamber Haidry", email = "qamber.haidry@quoxiom.com" }]
keywords = ["wallpaper", "desktop", "linux", "automation", "background"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Desktop Environment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]

dependencies = ["requests>=2.25.0", "Pillow>=8.0.0"]

[project.optional-dependencies]
gui = ["PySide6>=6.5.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "black==24.10.0",
    "flake8==7.3.0",
    "mypy==1.10.1",
]
test = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "pytest-mock>=3.10.0"]
docs = ["mkdocs>=1.5.0", "mkdocs-material>=9.0.0"]
full = [
    "PySide6>=6.5.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "black==24.10.0",
    "flake8==7.3.0",
    "mypy==1.10.1",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
]
all = ["muralis[dev,gui,test,docs,full]"]

[project.urls]
"Homepage" = "https://github.com/quoxiom/muralis"
"Documentation" = "https://quoxiom.github.io/muralis/"
"Repository" = "https://github.com/quoxiom/muralis"
"Issues" = "https://github.com/quoxiom/muralis/issues"
"Changelog" = "https://github.com/quoxiom/muralis/releases"

[project.scripts]
muralis = "muralis.__main__:main"
muralis-gui = "muralis.gui:run_gui"

[tool.setuptools]
package-dir = { "" = "src" }
packages = { find = { where = ["src"] } }
include-package-data = true

[tool.setuptools.package-data]
muralis = [
    "py.typed",
    "*.ini",
    "i18n/*.json",
    "gui/themes/*.json",
    "gui/icons/*.svg",
]

[tool.setuptools.dynamic]
version = { attr = "muralis.__version__" }

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | venv
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
files = ["src/muralis", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = ["-ra", "-q", "--strict-markers", "--strict-config", "--tb=short"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src/muralis"]
omit = ["*/tests/*", "*/_version.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if False:",
]
ignore_errors = true

[tool.pylint.main]
ignore = ["tests", "docs", "build", "dist"]
fail-under = 8.0

[tool.pylint.messages_control]
disable = [
    "C0111", # missing-docstring
    "C0103", # invalid-name
    "R0903", # too-few-public-methods
    "R0201", # no-self-use
]

[tool.pylint.design]
max-args = 7
max-attributes = 15
max-locals = 20

[tool.pylint.format]
max-line-length = 100
max-module-lines = 1200

[tool.bandit]
exclude_dirs = ["tests", "docs"]
skips = ["B101", "B311"]

[tool.pre-commit-config]
rev = "v4.4.0"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-yaml" },
    { id = "check-added-large-files" },
    { id = "check-json" },
    { id = "check-toml" },
]
